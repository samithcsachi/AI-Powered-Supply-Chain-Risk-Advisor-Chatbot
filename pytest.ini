[pytest]
# Pytest configuration for Supply Chain Risk Advisor

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    integration: Integration tests that use real models (slow)
    unit: Unit tests with mocked dependencies (fast)
    slow: Slow-running tests
    asyncio: Asynchronous tests

# Asyncio configuration
asyncio_mode = auto

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    
# Coverage options (if using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = 
#     --cov=src
#     --cov-report=html
#     --cov-report=term-missing

# Test paths
testpaths = tests

# Ignore directories
norecursedirs = .git .tox dist build *.egg venv* node_modules

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning